name: Ειδήσεις Ολυμπιακού

on:
  schedule:
    - cron: "*/15 * * * *"     # κάθε 15 λεπτά (το GitHub μπορεί να καθυστερήσει λίγα λεπτά)
  workflow_dispatch: {}          # και χειροκίνητα από την καρτέλα Actions

permissions:
  contents: write

concurrency:
  group: news
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Συλλογή ειδήσεων
        run: python3 scripts/fetch_news.py
      - name: Συλλογή βίντεο
        run: python3 scripts/fetch_videos.py || echo "τα βίντεο απέτυχαν, συνεχίζουμε"
      - name: Πρόγραμμα TV (κάθε 6 ώρες)
        run: python3 scripts/fetch_tv.py || echo "το πρόγραμμα TV απέτυχε, συνεχίζουμε"
      - name: Φετινή Super League (κάθε 6 ώρες)
        run: python3 scripts/update_football.py || echo "η Super League απέτυχε, συνεχίζουμε"
      - name: Ελληνικά ονόματα παικτών (Wikidata)
        run: python3 scripts/fetch_player_names.py || echo "τα ονόματα απέτυχαν, συνεχίζουμε"
      - name: Παίκτες όλων των εποχών (Wikidata, μία φορά την εβδομάδα)
        run: python3 scripts/fetch_all_players.py || echo "οι παίκτες απέτυχαν, συνεχίζουμε"
      - name: Δημιουργία σελίδων (αρχείο, προεπισκοπήσεις, sitemap)
        run: python3 scripts/build_archive.py
      - name: Εικόνες κοινοποίησης αγώνων
        run: |
          pip install -q pillow
          python3 scripts/og_images.py || echo "οι εικόνες απέτυχαν, συνεχίζουμε"
      - name: Αποθήκευση αν άλλαξε κάτι
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add -A .
          if git diff --cached --quiet; then echo "Καμία αλλαγή"; exit 0; fi
          git commit -m "Αυτόματη ανανέωση $(date -u +'%Y-%m-%d %H:%M')"
          for i in 1 2 3; do
            git pull --rebase --autostash || true
            git push && exit 0
            echo "η αποθήκευση απέτυχε, ξαναδοκιμάζω σε 20 δευτερόλεπτα"; sleep 20
          done
          exit 1
